<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      margin: 0;
      background: #f7f9fc;
    }
    header {
      background: #4a90e2;
      color: #fff;
      padding: 12px 16px;
      font-size: 18px;
      font-weight: 600;
    }
    .chat-wrapper {
      max-width: 800px;
      margin: 20px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      display: flex;
      flex-direction: column;
      height: 500px;
    }
    .chat-header {
      padding: 10px 14px;
      border-bottom: 1px solid #ddd;
      font-weight: 600;
      background: #eaf2ff;
    }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }
    .msg {
      margin: 6px 0;
      padding: 8px 14px;
      border-radius: 18px;
      max-width: 70%;
      word-wrap: break-word;
      line-height: 1.4;
    }
    .msg.me {
      background: #4a90e2;
      color: #fff;
      margin-left: auto;
    }
    .msg.other {
      background: #f1f1f1;
      color: #333;
      margin-right: auto;
    }
    .chat-input {
      display: flex;
      border-top: 1px solid #ddd;
    }
    .chat-input input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
      font-size: 15px;
    }
    .chat-input button {
      background: #4a90e2;
      color: #fff;
      border: none;
      width: 70px;
      cursor: pointer;
      font-size: 16px;
    }
    .chat-input button:hover {
      background: #357bd1;
    }
  </style>
</head>
<body>
  <header>KidsLearn | Chat</header>
  <div class="chat-wrapper">
    <div class="chat-header">
      Chatting with <span id="chatWith">Bo Bo</span>
    </div>
    <div id="chatBox" class="chat-box">
      <!-- Messages will appear here -->
      <div class="msg other">Hi, this is Bo Bo 🙂</div>
      <div class="msg me">Hello! I’m Khaing.</div>
    </div>
    <div class="chat-input">
      <input id="msgInput" type="text" placeholder="Type a message..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
<script>
  const chatBox = document.getElementById('chatBox');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');

  const socket = io(); // connect to same host:port

  function appendMsg(text, type) {
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text) return;
    const msg = { from: "Khaing", fromName: "Khaing", to: "BoBo", text }; // fill dynamically later
    socket.emit("message", msg);
    appendMsg(text, "me");
    msgInput.value = "";
  }

  socket.on("message", (data) => {
    // ignore my own echo? (optional)
    if (data.from === "Khaing") return;
    appendMsg(`${data.fromName}: ${data.text}`, "other");
  });

  sendBtn.addEventListener("click", sendMessage);
  msgInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
