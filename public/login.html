<!DOCTYPE html>
<html lang="my">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | KidsLearn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
    }

    .fade-in {
      animation: fadeIn 1s ease-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body class="min-h-screen bg-[#FFD166] flex items-center justify-center relative">

  <div
    class="flex flex-col md:flex-row bg-white rounded-3xl shadow-lg overflow-hidden w-[90%] max-w-4xl border border-[#FFE8B0]">
    <div class="w-full md:w-1/2 bg-[#E6F0FF] flex items-center justify-center p-6">
      <img src="kidb.png" alt="Child Illustration" class="w-4/5 object-contain" />
    </div>

    <div class="w-full md:w-1/2 p-8 md:p-10 bg-[#FFF9E6] flex flex-col justify-center">
      <img src="Baby.jpeg" id="profileImage"
        class="w-32 h-32 mx-auto rounded-full mb-6 object-cover shadow-md opacity-0 transition-opacity duration-700"
        alt="Kid Cartoon">

      <div id="formContainer" class="opacity-0 pointer-events-none transition-opacity duration-700">
        <h2 class="text-3xl font-semibold text-[#4A90E2] text-center mb-6">ပြန်လည်ကြိုဆိုပါတယ်!</h2>

        <form id="loginForm" class="space-y-4">
          <div>
            <input type="email" name="email" placeholder="အီးမေးလ်" required
              class="w-full p-3 rounded-xl border border-gray-200 focus:border-[#4A90E2] outline-none transition" />
            <p id="emailError" class="text-red-500 text-xs mt-1 hidden">အီးမေးလ်မှားနေပါတယ်။ ထပ်မံကြိုးစားပါ။</p>
          </div>

          <div>
            <input type="password" name="password" placeholder="စကားဝှက်" required
              class="w-full p-3 rounded-xl border border-gray-200 focus:border-[#4A90E2] outline-none transition" />
            <p id="passwordError" class="text-red-500 text-xs mt-1 hidden">စကားဝှက်မှားနေပါတယ်။ ထပ်မံကြိုးစားပါ။</p>
          </div>

          <button type="submit"
            class="w-full py-3 bg-[#4A90E2] text-white font-bold rounded-xl hover:bg-[#357ABD] transition duration-300">
            ဝင်မယ်
          </button>
        </form>

        <p class="mt-5 text-sm text-center text-gray-600">
          အကောင့်မရှိသေးပါသလား?
          <a href="signup.html" class="text-[#4A90E2] font-semibold hover:underline">အကောင့်သစ်ဖွင့်မယ်</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    // Image and form animation
    window.addEventListener('DOMContentLoaded', () => {
      const image = document.getElementById('profileImage');
      const form = document.getElementById('formContainer');
      setTimeout(() => {
        image.classList.remove('opacity-0');
        image.classList.add('opacity-100');
        setTimeout(() => { form.classList.remove('opacity-0', 'pointer-events-none'); form.classList.add('fade-in'); }, 700);
      }, 500);
    });

    document.getElementById('formContainer').querySelector('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = e.target.email.value;
      const password = e.target.password.value;

      // Error placeholders
      const emailError = document.getElementById('emailError');
      const passwordError = document.getElementById('passwordError');

      // Clear previous errors
      emailError.classList.add('hidden');
      passwordError.classList.add('hidden');

      try {
        const res = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          // Success → no alert, just redirect
          window.location.href = '/home.html';
        } else {
          // Handle specific error messages
          if (data.message?.toLowerCase().includes("email")) {
            emailError.classList.remove('hidden');
          } else if (data.message?.toLowerCase().includes("password")) {
            passwordError.classList.remove('hidden');
          } else {
            // fallback error
            passwordError.textContent = data.message || 'ဝင်မရနိုင်ပါ။ ထပ်မံကြိုးစားပါ။';
            passwordError.classList.remove('hidden');
          }
        }
      } catch (err) {
        console.error(err);
        passwordError.textContent = 'ဆာဗာနှင့် ချိတ်ဆက်မှုအမှား ဖြစ်နေပါသည်။';
        passwordError.classList.remove('hidden');
      }
    });
  </script>
</body>

</html>
