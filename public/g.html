<!DOCTYPE html>
<html lang="my">

<head>
  <meta charset="UTF-8">
  <title>Myanmar Letter Boxes</title>
  <style>
    body {
      font-family: "Noto Sans Myanmar", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 120px);
      grid-gap: 20px;
    }

    .box {
      background: linear-gradient(135deg, #ecf4f5, #ec3a08);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 36px;
      font-weight: bold;
      width: 120px;
      height: 120px;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    /* glossy light effect */
    .box::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: rgba(255, 255, 255, 0.2);
      transform: rotate(25deg);
      transition: 0.5s;
    }

    .box:hover::before {
      top: -70%;
      left: -70%;
    }

    /* hover animation */
    .box:hover {
      transform: translateY(-10px) scale(1.08);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.35);
    }


    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      max-width: 900px;
      width: 90%;
      display: flex;
      gap: 30px;
      align-items: flex-start;
      position: relative;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
    }

    .modal-letter {
      font-size: 80px;
      font-weight: bold;
      color: #ff6b6b;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffecec;
      border-radius: 15px;
      width: 150px;
      height: 150px;
      box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .modal-right {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .item {
      text-align: center;
    }

    .item img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .item p {
      font-size: 18px;
      color: #333;
      margin: 0;
    }

    .close {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 30px;
      cursor: pointer;
      color: #ff3333;
      font-weight: bold;
    }

    .close:hover {
      color: #cc0000;
    }
  </style>
</head>

<body>

    <div class="box" onclick="openModal('က', [
        {text:'ကား', img:'car.png'},
        {text:'ကလေး', img:'child.png'},
        {text:'ကြောင်', img:'cat.png'},
        {text:'ကြွက်', img:'rat.png'}
    ])">က</div>
    <div class="box" onclick="openModal('ခ', [
        {text:'ခွေး', img:'dog.png'},
        {text:'ခါးပတ်', img:'belt.png'},
        {text:'ခရမ်းချဉ်သီး', img:'eggplant.png'},
        {text:'ခရု', img:'snail.png'}
    ])">ခ</div>
    <!-- အခြားစာတွေကိုလည်း ဒီပုံစံနဲ့ ဆက်ထည့်လို့ရတယ် -->
  </div>

  <!-- Modal -->
  <div id="myModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <div class="modal-letter" id="letter"></div>
      <div class="modal-right" id="items"></div>
    </div>
  </div>

  <script>
    function openModal(letter, items) {
      document.getElementById("letter").innerText = letter;
      const itemsContainer = document.getElementById("items");
      itemsContainer.innerHTML = "";
      items.forEach(item => {
        itemsContainer.innerHTML += `
          <div class="item">
            <img src="${item.img}" alt="${item.text}">
            <p>${item.text}</p>
          </div>
        `;
      });
      document.getElementById("myModal").style.display = "flex";
    }
    function closeModal() {
      document.getElementById("myModal").style.display = "none";
    }
  </script>
</body>

  <script>
    let currentPage = 1;
    const totalPages = 2;

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    function showPage(page) {
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      document.getElementById("page" + page).classList.add("active");
    }

    prevBtn.addEventListener("click", () => {
      if (currentPage === 1) {
        // page1 မှာရင် နောက်သို့ button ကိုနှိပ်တာနဲ့ b.html သို့သွား
        window.location.href = "b.html";
      } else if (currentPage > 1) {
        currentPage--;
        showPage(currentPage);
      }
    });


    nextBtn.addEventListener("click", () => {
      if (currentPage < totalPages) {
        currentPage++;
        showPage(currentPage);
      }
    });

    function openModal(letter, desc, img) {
      document.getElementById("letter").innerText = letter;
      document.getElementById("description").innerText = desc;
      document.getElementById("modalImage").src = img;
      document.getElementById("myModal").style.display = "flex";
    }
    function closeModal() {
      document.getElementById("myModal").style.display = "none";
    }

    function updateButtons() {
      // page2 မှာ nextBtn ကို disable
      if (currentPage === 2) {
        nextBtn.disabled = true;
        nextBtn.style.opacity = 0.5;   // disabled feel
        nextBtn.style.cursor = 'not-allowed';
      } else {
        nextBtn.disabled = false;
        nextBtn.style.opacity = 1;
        nextBtn.style.cursor = 'pointer';
      }
    }
