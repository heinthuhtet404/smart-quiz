<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KidsLearn Myanmar Letters</title>
<style>
  body {
    font-family: "Noto Sans Myanmar", sans-serif;
    margin: 0; padding: 0;
    background: linear-gradient(135deg, #FFD166, #4A90E2);
    display: flex; flex-direction: column; align-items: center;
  }

  nav {
    width: 100%; background: #fff; padding: 10px 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  nav ul { display: flex; list-style: none; justify-content: center; margin:0; padding:0; gap:20px; }
  nav a { text-decoration:none; color:#4A90E2; font-weight:600; }
  nav a.active { text-decoration: underline; }

  .page { display: none; padding:20px; width:100%; max-width:1200px; display:grid; grid-template-columns: repeat(auto-fill,minmax(100px,1fr)); gap:15px; justify-items:center; }
  .page.active { display:grid; }

  .box {
    background: #fff; color:#4A90E2;
    font-size:2rem; font-weight:bold;
    width:100px; height:100px; border-radius:20px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 5px 15px rgba(0,0,0,0.2);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .box:hover { transform: translateY(-5px) scale(1.05); box-shadow:0 8px 20px rgba(0,0,0,0.3); }

  .btn-container { margin: 20px; display:flex; gap:20px; }
  .btn-container button { padding:10px 20px; font-size:1rem; font-weight:600; border:none; border-radius:10px; cursor:pointer; background:#4A90E2; color:#FFD166; transition:0.3s; }
  .btn-container button:hover:not(:disabled) { opacity:0.8; }
  .btn-container button:disabled { opacity:0.5; cursor:not-allowed; }

  /* Modal */
  .modal {
    display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.6); justify-content:center; align-items:center; padding:20px;
    z-index:10;
  }
  .modal-content {
    background:#fff; border-radius:20px; padding:20px; max-width:800px; width:100%;
    display:flex; gap:20px; align-items:flex-start; position:relative;
    box-shadow:0 8px 25px rgba(0,0,0,0.25);
  }
  .modal img { width:200px; height:200px; object-fit:cover; border-radius:15px; }
  .modal-text { flex:1; }
  .modal-text h2 { font-size:2rem; color:#4A90E2; margin:0 0 10px; }
  .modal-text p { font-size:1rem; color:#333; margin:0; }
  .close { position:absolute; top:10px; right:15px; font-size:2rem; color:#ff3333; cursor:pointer; }
  .close:hover { color:#cc0000; }
</style>
</head>
<body>

<!-- Navigation -->
<nav>
  <ul>
    <li><a href="#" class="active" onclick="navigateTo(1)">ပင်မစာမျက်နှာ</a></li>
    <li><a href="#" onclick="navigateTo(2)">သင်ခန်းစာများ</a></li>
    <li><a href="#">စကားပြောခန်း</a></li>
    <li><a href="#">အကောင့်ဝင်ရန်</a></li>
  </ul>
</nav>

<!-- Page 1 -->
<div id="page1" class="page active">
  <div class="box" onclick="navigateTo(2)">က</div>
  <div class="box" onclick="navigateTo(2)">ခ</div>
  <div class="box" onclick="navigateTo(2)">ဂ</div>
  <div class="box" onclick="navigateTo(2)">ဃ</div>
  <div class="box" onclick="navigateTo(2)">င</div>
  <!-- လိုလိုသလို အခြားစာတွေ ထည့်နိုင်သည် -->
</div>

<!-- Page 2 -->
<div id="page2" class="page">
  <div class="box" onclick="openModal('က', 'ကား, ကလေး, ကြောင်, ကြွက်', 'ka.jpg')">က</div>
  <div class="box" onclick="openModal('ခ', 'ခွေး, ခါးပတ်, ခရမ်းချဉ်သီး, ခရု', 'kha.jpg')">ခ</div>
  <div class="box" onclick="openModal('ဂ', 'ဂရုစိုက်ပါကွယ်', 'ga.jpg')">ဂ</div>
</div>

<!-- Navigation Buttons -->
<div class="btn-container">
  <button id="prevBtn">နောက်သို့</button>
  <button id="nextBtn">ရှေ့သို့</button>
</div>

<!-- Modal -->
<div id="myModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <img id="modalImage" src="" alt="Image">
    <div class="modal-text">
      <h2 id="letter"></h2>
      <p id="description"></p>
    </div>
  </div>
</div>

<script>
let currentPage = 1;
const totalPages = 2;

function showPage(page) {
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById("page"+page).classList.add("active");
  updateButtons();
}

document.getElementById("prevBtn").addEventListener("click", ()=>{
  if(currentPage > 1) { currentPage--; showPage(currentPage); }
});
document.getElementById("nextBtn").addEventListener("click", ()=>{
  if(currentPage < totalPages) { currentPage++; showPage(currentPage); }
});

function updateButtons(){
  document.getElementById("prevBtn").disabled = (currentPage===1);
  document.getElementById("nextBtn").disabled = (currentPage===totalPages);
}

function navigateTo(page){ currentPage = page; showPage(currentPage); }

function openModal(letter, desc, img){
  document.getElementById("letter").innerText = letter;
  document.getElementById("description").innerText = desc;
  document.getElementById("modalImage").src = img;
  document.getElementById("myModal").style.display = "flex";
}
function closeModal(){ document.getElementById("myModal").style.display = "none"; }

showPage(currentPage);
</script>

</body>
</html>
