    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;

      /* background: linear-gradient(135deg, #a1c4fd, #c2e9fb); */
      background-color: #f7faff;
      font-family: "Noto Sans Myanmar", sans-serif;
    }

    .logo {
      display: flex;
      position: absolute;
      left: 0;
      top: 3%;
      font-size: 28px;
      font-family: 'Fredoka One', cursive;
    }

    .logo i {
      font-size: 32px;
      color: #FFD166;
    }

    nav {
      display: flex;
      justify-content: center;
      /* width: 100%; */
      background: #4A90E2;
      /* padding: 30px 0; */
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    /* .nav-list {
      display: flex;
      list-style: none;
      gap: 25px;
      margin: 0;
      padding: 0;
      justify-content: center;
    } */

    .nav-item {
      text-align: center;
    }

    .nav-link {
      /* display: block; */
      /* padding: 16px 28px; */
      background-color: rgba(255, 255, 255, 0.15);
      color: white;
      text-decoration: none;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 18px;
      border-radius: 30px;
      transition: all 0.3s ease;
      min-height: 54px;
      min-width: 54px;
    }

    .nav-link:hover {
      background-color: #50E3C2;
      color: #fff;
      transform: scale(1.08);
    }

    .nav-link.active {
      background-color: #ffd566;
      color: #333;
      box-shadow: 0 4px 14px rgba(255, 213, 102, 0.5);
    }

    /* Page container */
    .page {
      display: none;
    }

    .page.active {
      display: grid;
    }

    /* --- Page 1 (Top Grid) --- */
    #page1 {
      grid-template-columns: repeat(5, 90px);
      gap: 12px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      justify-content: center;
      align-items: center;
    }

    .cell {
      width: 90px;
      height: 90px;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      font-weight: bold;
      color: #333;
      background: #fff;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
    }

    .cell:nth-child(5n+1) {
      background: #ffcccc;
    }

    .cell:nth-child(5n+2) {
      background: #ffe0b3;
    }

    .cell:nth-child(5n+3) {
      background: #ffffb3;
    }

    .cell:nth-child(5n+4) {
      background: #ccffcc;
    }

    .cell:nth-child(5n+5) {
      background: #e0ccff;
    }

    .cell:hover {
      transform: scale(1.1) rotate(-3deg);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
    }

    .last-row {
      grid-column: span 5;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .last-row .cell {
      flex: 0 0 90px;
    }

    /* --- Page 2 (Letter Boxes) --- */
    /* --- Page 2 (Letter Boxes) --- */
    /* --- Page 2 (Letter Boxes) --- */
    #page2 {
      grid-template-columns: repeat(5, 100px);
      gap: 15px;
      margin-top: 20px;
      justify-content: center;
    }

    .box {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      font-weight: bold;
      width: 100px;
      height: 100px;
      border-radius: 18px;
      cursor: pointer;
      background: #fff;
      color: #333;
      border: 3px solid transparent;
      box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.08),
        0 4px 10px rgba(0, 0, 0, 0.2);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .box:hover {
      transform: scale(1.08) rotate(2deg);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1),
        0 8px 18px rgba(0, 0, 0, 0.35);
    }

    /* အရောင် theme — border glow အနေနဲ့သုံး */
    .orange {
      border-color: #ff9800;
      box-shadow: 0 0 12px #ff9800aa;
    }

    .green {
      border-color: #4caf50;
      box-shadow: 0 0 12px #4caf50aa;
    }

    .red {
      border-color: #f44336;
      box-shadow: 0 0 12px #f44336aa;
    }

    .blue {
      border-color: #2196f3;
      box-shadow: 0 0 12px #2196f3aa;
    }

    .black {
      border-color: #555;
      box-shadow: 0 0 12px #555555aa;
    }


    /* --- Buttons --- */
    .btn-container {
      display: flex;
      justify-content: center;
      /* center မှာထားချင်တာ */
      gap: 20px;
      /* buttons ကြားထဲ space */
      margin: 20px auto;
      /* center အတွက် auto */
    }

    .btn-container button {
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #ffcc80;
      transition: background 0.2s;
    }

    .btn-container button:hover {
      background: #ffa726;
    }

    /* --- Modal --- */
    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
    }

    .modal-text p {

    }

    .modal-content img {

      border-radius: 10px;
    }

    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 22px;
      cursor: pointer;
      color: red;
    }

    .site-nav {
      background: #ffffff;
      padding: 0px 6%;
      display: flex;

      font-weight: 700;
      color: #5B8DEF;

      margin-right: 8px;
    }

    .site-nav__list {

      display: flex;
      gap: 26px;

    .site-nav__item {}

    .site-nav__link {
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      color: #374151;
      position: relative;
      padding-bottom: 4px;
      transition: color 0.25s ease;
    }

    .site-nav__link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 0;
      height: 2px;
      background: #5B8DEF;
      transition: width 0.25s ease;
    }

    .site-nav__link:hover,
    .site-nav__link--active {
      color: #5B8DEF;
    }

    .site-nav__link:hover::after,
    .site-nav__link--active::after {
      width: 100%;
    }

    /* ================= MOBILE ================= */
    @media (max-width: 768px) {

  </style>

      onclick="openModal('သ', 'သ ကလေး သ ကလေး ချစ်စရာ သ ကလေး သရက် သခွား ချိုချိုအေး သဇင်ပန်းက ကြူကြူမွှေး အဲဒါ သ ကလေး', 'tha.jpg')">
      သ</div>

    <div class="box green"
      onclick="openModal('ဟ', 'ဟ ကလေး ဟ ကလေး သားသား မီးမီး သံချိုတေး ဟ ဟလေး ရယ်‌သံပေး မေ့မေ့နားဝင်အေး', 'ha.jpg')">ဟ
    </div>
    <div class="box blue"
      onclick="openModal('အ', 'အ အမေ တို့တိုင်းပြည် အမြဲချစ်ခင်ပေ အမေ့ရဲ့သား မြန်ပြည်ဖွား အများအတွက် တို့ကြိုးစား', 'a.jpg')">
      အ</div>

  <!-- <div class="btn-container">
    <button id="prevBtn">နောက်သို့</button>
    <button id="nextBtn">ရှေ့သို့</button>
  </div> -->
  </div>

  

  <!-- Modal -->
  <div id="myModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <img id="modalImage" src="" alt="Image">
      <div class="modal-text">
        <h2 id="letter"></h2>
        <p id="description"></p>
      </div>
    </div>
  </div>

  <script>
    let currentPage = 1;
    const totalPages = 2;

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    function showPage(page) {
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      document.getElementById("page" + page).classList.add("active");
    }

    prevBtn.addEventListener("click", () => {
      if (currentPage === 1) {
        // page1 မှာရင် နောက်သို့ button ကိုနှိပ်တာနဲ့ b.html သို့သွား
        window.location.href = "b.html";
      } else if (currentPage > 1) {
        currentPage--;
        showPage(currentPage);
      }
    });


    nextBtn.addEventListener("click", () => {
      if (currentPage < totalPages) {
        currentPage++;
        showPage(currentPage);
      }
    });

    function openModal(letter, desc, img) {
      document.getElementById("letter").innerText = letter;
      document.getElementById("description").innerText = desc;
      document.getElementById("modalImage").src = img;
      document.getElementById("myModal").style.display = "flex";
    }
    function closeModal() {
      document.getElementById("myModal").style.display = "none";
    }

    function updateButtons() {
      // page2 မှာ nextBtn ကို disable
      if (currentPage === 2) {
        nextBtn.disabled = true;
        nextBtn.style.opacity = 0.5;   // disabled feel
        nextBtn.style.cursor = 'not-allowed';
      } else {
        nextBtn.disabled = false;
        nextBtn.style.opacity = 1;
        nextBtn.style.cursor = 'pointer';
      }
    }

    // showPage function မှာ call လုပ်မယ်
    function showPage(page) {
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      const pageEl = document.getElementById("page" + page);
      if (pageEl) pageEl.classList.add("active");

      updateButtons(); // button status refresh
    }

    // အစမှာလည်း update
    updateButtons();

  </script>
</body>
